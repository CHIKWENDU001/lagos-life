name: Register And Run

on:
  workflow_dispatch:
    inputs:
      register_goal:
        description: "How many accounts reg.js should create"
        required: false
        default: "300"
      register_workers:
        description: "How many concurrent registration workers to run"
        required: false
        default: "10"
      accounts_file:
        description: "Where to store generated accounts inside the runner"
        required: false
        default: "artifacts/accs.json"

jobs:
  register-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      API_URL: ${{ secrets.LAGOSLIFE_API_URL }}
      TARGET_GAME_ID: ${{ secrets.LAGOSLIFE_TARGET_GAME_ID }}
      TEMPLATE_USERNAME: ${{ secrets.LAGOSLIFE_TEMPLATE_USERNAME }}
      TEMPLATE_PASSWORD: ${{ secrets.LAGOSLIFE_TEMPLATE_PASSWORD }}
      LOOP_FOREVER: "true"
      REGISTER_GOAL: ${{ inputs.register_goal }}
      REGISTER_WORKERS: ${{ inputs.register_workers }}
      ACCOUNTS_FILE: ${{ inputs.accounts_file }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$TARGET_GAME_ID" || { echo "Missing secret: LAGOSLIFE_TARGET_GAME_ID"; exit 1; }
          test -n "$TEMPLATE_USERNAME" || { echo "Missing secret: LAGOSLIFE_TEMPLATE_USERNAME"; exit 1; }
          test -n "$TEMPLATE_PASSWORD" || { echo "Missing secret: LAGOSLIFE_TEMPLATE_PASSWORD"; exit 1; }

      - name: Show runtime configuration
        run: |
          echo "REGISTER_GOAL=$REGISTER_GOAL"
          echo "REGISTER_WORKERS=$REGISTER_WORKERS"
          echo "ACCOUNTS_FILE=$ACCOUNTS_FILE"

      - name: Register accounts
        run: node reg.js

      - name: Run job
        run: node job.js

      - name: Upload generated accounts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lagoslife-accounts
          path: ${{ env.ACCOUNTS_FILE }}
          if-no-files-found: warn
